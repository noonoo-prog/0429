<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>파티 | 메이플 기록</title>
<meta name="description" content="배율 관리, 파티 계획, 캐릭터 배율을 보며 파티를 직접 편성하고 저장합니다.">
<script>
(function(){try{if(localStorage.getItem("boss-board-theme-v1")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}})();
</script>
<link rel="stylesheet" href="../boss/style.css?v=workspace-nav-v2-20261106">
<link rel="stylesheet" href="../boss/party-boss.css?v=rate-by-difficulty-v3-20261105">
<link rel="stylesheet" href="../boss/party-recruit.css?v=direct-board-v3-20261106">
<link rel="stylesheet" href="./style.css?v=workspace-nav-v2-20261106">
</head>
<body>
<div class="party-app">
  <header class="party-header">
    <div class="workspace-actions" aria-label="페이지 이동 및 화면 설정">
      <a class="workspace-nav-link" href="../boss/">보스 현황판</a>
      <button class="theme-toggle workspace-theme" id="partyThemeToggle" type="button" aria-label="다크모드 켜기" title="화면 테마 변경"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-text">다크</span></button>
    </div>
    <div class="party-intro">
      <div>
        <span class="party-eyebrow">MAPLE RECORDS / 파티</span>
        <h1>파티</h1>
        <p id="partyDescription">배율 관리 · 파티 계획 · 직접 편성</p>
      </div>
      <span class="party-live-note">기존 보스 현황판 데이터와 연결</span>
    </div>
    <nav class="party-tabs" aria-label="파티 메뉴">
      <button type="button" class="party-tab active" data-party-tab="rates" aria-selected="true">
        <span>01</span> 배율 관리
      </button>
      <button type="button" class="party-tab" data-party-tab="plan" aria-selected="false">
        <span>02</span> 파티 계획
      </button>
      <button type="button" class="party-tab" data-party-tab="recruit" aria-selected="false">
        <span>03</span> 직접 편성
      </button>
    </nav>
  </header>
  <main class="party-main">
    <section id="rateManagerPanel" class="party-panel rate-manager" aria-label="배율 관리">
      <div class="rate-loading">배율과 캐릭터 정보를 불러오는 중…</div>
    </section>
    <section class="party-boss-panel party-panel" id="partyBossPanel" aria-label="파티보스 계획" hidden>
      <div class="party-boss-empty">파티 계획 정보를 불러오는 중…</div>
    </section>
    <section class="recruit-panel party-panel" id="routePanel" aria-label="직접 파티 편성" hidden>
      <div class="recruit-loading">모집 정보를 불러오는 중…</div>
    </section>
  </main>
  <footer class="party-footer">배율은 캐릭터 · 보스 · 난이도별로 공용 저장됩니다. 보스 체크 및 수익 기록은 기존 화면에서 관리합니다.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="rate-loading">JavaScript를 켜면 파티를 관리할 수 있습니다.</div></noscript>
<script defer src="../boss/party-boss.js?v=party-potluck-v1-20261106"></script>
<script defer src="../boss/party-recruit.js?v=direct-board-v3-20261106"></script>
<script defer src="./app.js?v=theme-unified-v1-20261106"></script>
</body>
</html>
