<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<script>
(function(){
  try{
    if(localStorage.getItem("boss-board-theme-v1")==="dark"){
      document.documentElement.setAttribute("data-theme","dark");
      var themeMeta=document.querySelector('meta[name="theme-color"]');
      if(themeMeta)themeMeta.setAttribute("content","#22272e");
    }
  }catch(e){}
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>보스 현황판</title>
<link rel="stylesheet" href="./style.css?v=route-owner-exclude-all-v7-20260924-1">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mainline">
          <h1 id="pageTitle">보스 현황판</h1>
          <div class="page-switch" role="tablist" aria-label="화면 선택">
            <button class="page-switch-btn active" id="boardViewBtn" type="button" data-page-view="board">보스 현황판</button>
            <button class="page-switch-btn" id="checklistViewBtn" type="button" data-page-view="checklist">보스 체크리스트</button>
            <button class="page-switch-btn" id="routeViewBtn" type="button" data-page-view="route">도핑 최소 루트</button>
          </div>
        </div>
        <p id="pageSub">주간 최대 12개 · 검은 마법사는 월간</p>
      </div>
      <div class="save save-controls" aria-live="polite">
        <span></span>
        <b id="saveText">공용 DB 연결 중…</b>
        <button class="save-board-btn" id="saveBoardBtn" type="button" disabled>저장</button>
      </div>
    </div>

    <nav class="ownerbar" aria-label="주인 선택">
      <div class="owner-scroll"><div class="owners" id="ownerTabs"></div></div>
    </nav>

    <div class="context-row">
      <div class="board-title" id="boardTitle"></div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크모드 켜기" title="화면 테마 변경">
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        <span class="theme-toggle-text">다크</span>
      </button>
      <details class="manage-menu">
        <summary>관리</summary>
        <div class="manage-popover">
          <div class="manage-grid">
            <button class="btn primary" id="unlockOwner">수정 잠금 해제</button>
            <button class="btn admin-edit span-2" id="adminUnlock">관리자 전체 수정</button>
            <button class="btn" id="addPlayer">+ 캐릭터</button>
            <button class="btn" id="addOwner">+ 주인</button>
            <button class="btn" id="renameOwner">이름 수정</button>
            <button class="btn" id="changePinOwner">비밀번호 변경</button>
            <button class="btn" id="shareBtn">주소 복사</button>
            <button class="btn" id="reloadBtn">새로고침</button>
            <button class="btn danger-lite span-2" id="removeOwner">현재 주인 삭제</button>
          </div>
        </div>
      </details>
    </div>

    <div class="party-filter-row" id="partyFilterRow">
      <button class="party-filter-btn" id="partyOnlyBtn" type="button" aria-pressed="false">
        <span class="party-filter-check" aria-hidden="true">✓</span>
        <span>2인 이상 파티만 보기</span>
      </button>
    </div>
  </header>

  <main class="content">
    <section class="desktop-board" aria-label="PC 보스 현황">
      <div id="desktopBoard" class="desktop-grid-scroll"></div>
    </section>

    <section class="mobile-board" id="mobileBoard" aria-label="모바일 보스 현황">
      <div class="mobile-loading">보스판을 불러오는 중…</div>
    </section>

    <p class="hint" id="boardHint">
      파티원은 등록된 캐릭터에서 선택할 수 있고, 자동 연동된 보스는 원본 파티에서만 수정됩니다.
    </p>

    <section class="checklist-panel" id="checklistPanel" hidden aria-label="주간 보스 체크리스트">
      <div class="checklist-loading">체크리스트를 불러오는 중…</div>
    </section>

    <section class="route-panel" id="routePanel" hidden aria-label="도핑 최소 파티 루트">
      <div class="route-empty">파티 루트를 계산하는 중…</div>
    </section>
  </main>
</div>

<div class="party-picker-backdrop" id="partyPicker" hidden>
  <section class="party-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="partyPickerTitle">
    <header class="picker-head">
      <div>
        <strong id="partyPickerTitle">파티원 선택</strong>
        <p id="partyPickerSub"></p>
      </div>
      <button class="picker-close" id="partyPickerClose" aria-label="닫기">×</button>
    </header>
    <div class="picker-search-wrap">
      <input id="partyPickerSearch" class="picker-search" type="search" placeholder="캐릭터 검색" autocomplete="off">
    </div>
    <div class="picker-content" id="partyPickerContent"></div>
    <footer class="picker-footer">
      <button class="btn" id="partyPickerManual">직접 입력</button>
      <button class="btn danger-lite" id="partyPickerClear">선택 지우기</button>
    </footer>
  </section>
</div>

<div class="toast" id="toast"></div>
<noscript><div style="padding:24px;font-family:sans-serif">JavaScript를 켜야 보스 현황판을 사용할 수 있어요.</div></noscript>
<script defer src="./app.js?v=route-owner-exclude-all-v7-20260924-1"></script>
</body>
</html>
