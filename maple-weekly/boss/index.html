<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>보스 현황판</title>
<link rel="stylesheet" href="./style.css?v=owner-colors-20260922-1">
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="titlebox">
    <h1>보스 현황판</h1>
    <p>주간 최대 12개 · 검은 마법사는 월간</p>
  </div>
  <div class="top-actions">
    <div class="toolbar">
      <button class="btn primary" id="addPlayer">+ 캐릭터</button>
      <button class="btn" id="shareBtn">주소 복사</button>
      <button class="btn" id="reloadBtn">새로고침</button>
    </div>
    <div class="save"><span></span><b id="saveText">공용 DB 연결 중…</b></div>
  </div>
</header>

<div class="ownerbar">
  <div class="owner-scroll"><div class="owners" id="ownerTabs"></div></div>
  <button class="owner-add" id="addOwner">+ 주인</button>
</div>

<div class="owner-tools">
  <button class="btn" id="unlockOwner">수정 잠금 해제</button>
  <button class="btn" id="renameOwner">이름 수정</button>
  <button class="btn danger-lite" id="removeOwner">삭제</button>
</div>

<div class="board-title" id="boardTitle"></div>

<section class="desktop-board shell">
  <div class="scroll"><table id="board"></table></div>
</section>

<section class="mobile-board" id="mobileBoard">
  <div class="mobile-loading">보스판을 불러오는 중…</div>
</section>

<p class="hint">
  다른 주인의 캐릭터 닉네임을 파티원으로 입력하면 상대 보스판에도 자동 연동됩니다.
  데미안·루시드·윌·더스크·진힐라·듄켈은 1인 고정입니다.
</p>
</div>
<div class="toast" id="toast"></div>
<noscript><div style="padding:24px;font-family:sans-serif">JavaScript를 켜야 보스 현황판을 사용할 수 있어요.</div></noscript>
<script defer src="./app.js?v=owner-colors-20260922-1"></script>
</body>
</html>
