const q=s=>s.startsWith('#')?document.getElementById(s.slice(1)):document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(op,o={}){let h={'Content-Type':'application/json'};if(S.token)h.Authorization='Bearer '+S.token;let r=await fetch(base+'?op='+op+(o.q||''),{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}),j=await r.json().catch(()=>({error:'응답 오류'}));if(r.status===401&&op!=='login'){localStorage.removeItem('sgToken');location.reload();throw Error(j.error||'로그인 만료')}if(!r.ok)throw Error(j.error||'요청 실패');return j}

function mUI(k,d){if(!k.startsWith('3.2.'))return'';let m=d.management||{},loc=['3.2.3','3.2.4','3.2.5'].includes(k)?'<label>설비 위치<select id="loc-'+k+'"><option></option><option'+(m.location==='지하'?' selected':'')+'>지하</option><option'+(m.location==='옥상'?' selected':'')+'>옥상</option><option'+(m.location==='기타'?' selected':'')+'>기타</option></select></label><input id="oth-'+k+'" placeholder="기타 위치" value="'+E(m.other||'')+'">':'';return'<div class="p" style="background:#fafafa"><b>점검주기·교체시기</b><div class="row">'+loc+'<label>실시여부<select id="act-'+k+'"><option></option><option'+(m.action==='점검'?' selected':'')+'>점검</option><option'+(m.action==='교체'?' selected':'')+'>교체</option><option'+(m.action==='해당없음'?' selected':'')+'>해당없음</option></select></label><label>점검주기(개월)<input id="cy-'+k+'" type="number" value="'+E(m.cycle??'')+'"></label><label>교체시기(년)<input id="yr-'+k+'" type="number" value="'+E(m.replace_year??'')+'"></label><label>근거/기록<input id="bs-'+k+'" value="'+E(m.basis||'')+'" placeholder="관리대장·점검표 등"></label></div><div class="muted">'+(k==='3.2.1'?'저수조 정기청소·위생점검 주기도 비고에 기록':k==='3.2.5'?'환기: 필터 교체 2회/년, 덕트 청소 1회/년 확인':'실제 관리기록 기준으로 입력')+'</div></div>'}
function card(k,n){let d=D(k),ps=P(k),g=G[k]||gen;return'<div class="c"><div class="hd"><h3>'+k+' '+E(n)+'</h3><div class="muted">사진 '+ps.length+'장 · '+E(d.result||'미평가')+'</div></div><div class="bd"><div class="guide"><b>현장 사진 체크리스트</b><ul>'+g.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul></div><div class="st">'+['양호','보통','미흡','불량','해당없음','점검불가'].map(x=>'<button class="'+(d.result===x?'on':'')+'" onclick="setS(\''+k+'\',\''+x+'\')">'+x+'</button>').join('')+'</div>'+mUI(k,d)+'<textarea id="nt-'+k+'" placeholder="점검현황·수치·사유·개선의견">'+E(d.note||'')+'</textarea><div style="margin-top:7px"><button class="pri" onclick="saveI(\''+k+'\')">기록 저장</button> <label class="ghost" style="display:inline-block;padding:10px;border-radius:9px;font-weight:700">📷 사진 촬영<input type="file" accept="image/*" capture="environment" style="display:none" onchange="up(\''+k+'\',this)"></label></div><div class="thumbs">'+ps.map(p=>'<div class="thumb"><img src="'+E(p.url)+'"><button onclick="delP(\''+p.id+'\')">×</button></div>').join('')+'</div></div></div>'}
function render(){let t=0,d=0,h='';gs.forEach(g=>{h+='<h2>'+g[0]+' '+g[1]+'</h2>';g[2].forEach(x=>{t++;if(D(x[0]).result)d++;h+=card(x[0],x[1])})});q('#items').innerHTML=h;q('#bar').style.width=(d/t*100)+'%';q('#prog').textContent='완료 '+d+' / '+t+' 항목'}
async function openV(id){S.v=await api('visit',{q:'&id='+id});S.b=S.v.building;q('#vt').textContent=S.b.name+' · '+S.v.visit.inspection_on;render();view('inspect')}async function reload(){await openV(S.v.visit.id)}
async function setS(k,v){let d=D(k);d.result=v;if(!S.v.items.some(x=>x.item_key===k))S.v.items.push(d);await saveI(k)}
function mg(k){if(!k.startsWith('3.2.'))return{};return{location:q('#loc-'+k)?.value||'',other:q('#oth-'+k)?.value||'',action:q('#act-'+k)?.value||'',cycle:q('#cy-'+k)?.value||null,replace_year:q('#yr-'+k)?.value||null,basis:q('#bs-'+k)?.value||''}}
async function saveI(k){try{let d=D(k),j=await api('item',{method:'PUT',body:{visit_id:S.v.visit.id,item_key:k,result:d.result,note:q('#nt-'+k).value,management:mg(k)}}),i=S.v.items.findIndex(x=>x.item_key===k);i>=0?S.v.items[i]=j.item:S.v.items.push(j.item);render()}catch(e){alert(e.message)}}
async function img(f){let im=await createImageBitmap(f),s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let b=await new Promise(r=>c.toBlob(r,'image/jpeg',.75)),u=new Uint8Array(await b.arrayBuffer()),x='';for(let i=0;i<u.length;i+=8192)x+=String.fromCharCode(...u.subarray(i,i+8192));return{base64:btoa(x),mime:'image/jpeg'}}
async function up(k,i){if(!i.files[0])return;try{let x=await img(i.files[0]);await api('photo',{method:'POST',body:{visit_id:S.v.visit.id,item_key:k,filename:i.files[0].name,...x}});await reload()}catch(e){alert(e.message)}finally{i.value=''}}
async function delP(id){if(!confirm('사진 삭제?'))return;await api('photo',{method:'DELETE',q:'&id='+id});await reload()}
function report(){let b=S.v.building||S.b,v=S.v.visit,h='<h1>건축물 정기점검 현장 보고서</h1><p><b>'+E(b.name)+'</b><br>'+E(b.address||'')+'<br>점검일 '+E(v.inspection_on)+' · 점검자 '+E(v.inspector||'')+'</p>';gs.forEach(g=>{h+='<h2>'+g[0]+' '+g[1]+'</h2>';g[2].forEach(x=>{let d=D(x[0]),ps=P(x[0]);h+='<div class="report"><h3>'+x[0]+' '+E(x[1])+' — '+E(d.result||'미평가')+'</h3>'+((d.management&&Object.values(d.management).some(Boolean))?'<p class="muted">위치: '+E(d.management.location||'-')+(d.management.other?'('+E(d.management.other)+')':'')+' · 관리: '+E(d.management.action||'-')+' · 점검주기: '+E(d.management.cycle??'-')+'개월 · 교체시기: '+E(d.management.replace_year??'-')+'년 · 근거: '+E(d.management.basis||'-')+'</p>':'')+'<p>'+E(d.note||'').replace(/\n/g,'<br>')+'</p><div class="rphotos">'+ps.map(p=>'<img src="'+E(p.url)+'">').join('')+'</div></div>'})});q('#rb').innerHTML=h;view('report')}
boot();
</script></body></html>
