<style>
*{box-sizing:border-box}body{margin:0;background:#dcdcdc;color:#333;font-family:"Malgun Gothic",Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:12px}input,textarea,button{font:inherit}.wrap{width:min(980px,calc(100% - 16px));margin:6px auto 14px}.window{border:1px solid #555;border-radius:4px;overflow:hidden;background:#cfcfcf;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 2px 8px rgba(0,0,0,.14)}.titlebar{min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;color:#fff;background:linear-gradient(#666,#4c4c4c);border-bottom:1px solid #3a3a3a;text-shadow:0 1px 1px rgba(0,0,0,.5)}.titlebar strong{font-size:14px;letter-spacing:-.02em}.week{font-size:11px;color:#ececec;white-space:nowrap}.body{padding:8px;background:#cfcfcf}.table{border:1px solid #a4a4a4;background:#bcbcbc}.row{display:grid;grid-template-columns:56px repeat(var(--char-count,3),minmax(105px,1fr)) 170px;gap:1px;background:#a4a4a4}.row+.row{margin-top:1px}.cell{background:#ececec;padding:5px;min-height:70px}.head .cell{min-height:38px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#444;background:#d9d9d9}.char-head{padding:4px;align-items:stretch!important;justify-content:stretch!important}.name-input{width:100%;height:28px;border:1px solid #9f9f9f;border-radius:2px;background:#efefef;color:#333;padding:4px 7px;font-size:12px;font-weight:700;outline:none}.name-input:focus,textarea:focus{border-color:#7f97ad;box-shadow:0 0 0 1px rgba(86,126,165,.18)}.day-cell{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 2px 4px;background:#dcdcdc;font-weight:700;color:#444;line-height:1.2;visibility:visible!important}.day-cell .day-name{display:block;font-size:15px;margin-bottom:5px}.day-cell .date{display:block;font-size:11px;color:#666}.day-cell.sat .day-name{color:#2f75b6}.day-cell.sun .day-name{color:#d45782}textarea{width:100%;min-height:59px;resize:vertical;border:1px solid #b5b5b5;border-radius:2px;background:#f8f8f8;color:#333;padding:7px;outline:none;line-height:1.42;font-size:12px}textarea::placeholder,.name-input::placeholder{color:#a7a7a7}.weekly{margin-top:8px;border:1px solid #a4a4a4;background:#e6e6e6;padding:8px}.weekly-title{margin:0 0 6px;font-size:12px;font-weight:700;color:#444}.weekly textarea{min-height:70px}.bottom{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.left-info{font-size:11px;color:#6e6e6e}.saved{opacity:0;transition:opacity .18s ease;margin-left:6px;color:#557755;font-weight:700}.saved.show{opacity:1}.actions{display:flex;gap:6px;align-items:center}.char-controls{display:flex;align-items:center;gap:5px;margin-bottom:7px}.char-controls .label{font-size:11px;color:#5f5f5f;font-weight:700;margin-right:2px}.char-count{min-width:34px;text-align:center;font-size:11px;color:#444;font-weight:700}.mini-btn{height:25px;min-width:28px;padding:0 7px;font-size:12px}button{height:31px;border:1px solid #666;border-radius:3px;padding:0 11px;background:linear-gradient(#fff,#d7d7d7);color:#333;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 #fff inset}button:hover{background:linear-gradient(#fff,#e2e2e2)}button:disabled{opacity:.42;cursor:default}.share-btn{color:#fff;border-color:#4c4c4c;background:linear-gradient(#6c6c6c,#505050);text-shadow:0 1px 0 rgba(0,0,0,.35)}.share-btn:hover{background:linear-gradient(#777,#5a5a5a)}.share-note{display:none;margin-top:8px;border:1px solid #a8b5c0;background:#edf3f8;color:#526675;padding:7px 9px;font-size:11px;line-height:1.45;border-radius:3px}.share-note.show{display:block}
@media(max-width:760px){body{font-size:14px;background:#d0d0d0}.wrap{width:100%;margin:0}.window{border-radius:0;border-left:0;border-right:0;box-shadow:none;min-height:100vh}.titlebar{position:sticky;top:0;z-index:5;min-height:42px;padding:9px 10px}.titlebar strong{font-size:15px}.week{font-size:10px}.body{padding:6px}.char-controls{position:sticky;top:42px;z-index:4;padding:5px 6px;margin:-1px 0 6px;background:#cfcfcf;border-bottom:1px solid #aaa}.mini-btn{min-height:32px;min-width:36px;font-size:15px}.table{border:0;background:transparent}.head{display:block;background:transparent}.head .cell:first-child,.head .cell:last-child{display:none}.head .char-head{display:block;min-height:auto;padding:0;margin-bottom:6px;background:transparent}.head .char-head:last-of-type{margin-bottom:8px}.name-input{height:37px;font-size:14px;border-radius:4px}.row.day-row{display:block;margin-bottom:6px;border:1px solid #9a9a9a;border-radius:4px;overflow:hidden;background:#bcbcbc}.row.day-row+.row.day-row{margin-top:0}.cell{min-height:auto;border-top:1px solid #d5d5d5;padding:5px}.row.day-row .cell:first-child{border-top:0}.day-cell{min-height:40px;display:flex!important;flex-direction:row;justify-content:space-between;align-items:center;padding:8px 9px;visibility:visible!important}.day-cell .day-name,.day-cell .date{margin:0;display:block}.day-cell .day-name{font-size:15px}.day-cell .date{font-size:11px}.mobile-label{display:block;margin:0 0 3px;font-size:10px;font-weight:700;color:#6d6d6d}textarea{min-height:56px;font-size:16px;border-radius:4px;padding:7px 8px}.weekly{padding:8px;border-radius:4px}.weekly textarea{min-height:76px}.bottom{flex-direction:column;align-items:stretch;gap:8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}.actions{width:100%}.actions button{flex:1;height:38px;font-size:12px}}
@media(max-width:360px){.titlebar{padding:8px 7px;gap:6px}.title-left{gap:6px}.history-actions{gap:3px}.history-btn{width:30px;height:28px;font-size:18px}.titlebar strong{font-size:14px;white-space:nowrap}.week{font-size:9px}}@media(min-width:761px){.mobile-label{display:none}}

.title-left{display:flex;align-items:center;gap:9px;min-width:0}.history-actions{display:flex;gap:4px;align-items:center}.history-btn{width:29px;height:25px;padding:0;border:1px solid rgba(255,255,255,.28);border-radius:3px;background:rgba(255,255,255,.10);color:#fff;font-size:18px;line-height:1;box-shadow:none;text-shadow:0 1px 1px rgba(0,0,0,.35)}.history-btn:hover{background:rgba(255,255,255,.18)}.history-btn:disabled{opacity:.28;background:rgba(255,255,255,.06)}@media(max-width:760px){.history-btn{width:34px;height:30px;font-size:20px}}
.plan-switcher{display:flex;align-items:center;gap:6px;margin-bottom:7px}.plan-switcher select{height:29px;min-width:210px;max-width:100%;border:1px solid #999;border-radius:3px;background:#f6f6f6;color:#333;padding:0 28px 0 8px;font-size:12px;font-weight:700}.plan-switcher button{height:29px}.shared-readonly .name-input,.shared-readonly textarea{background:#f1f1f1;color:#555}.shared-readonly .char-controls{opacity:.72}@media(max-width:760px){.plan-switcher{margin-bottom:6px}.plan-switcher select{flex:1;min-width:0;height:36px;font-size:14px}.plan-switcher button{height:36px;white-space:nowrap}}
.tone-ottok{background:#fce8cf!important}.tone-tsujo{background:#f8dce8!important}.tone-peacock{background:#e3f2d7!important}
.tone-ottok .name-input,.tone-ottok textarea,.name-input.tone-ottok,textarea.tone-ottok{background:#fff7ed!important}
.tone-tsujo .name-input,.tone-tsujo textarea,.name-input.tone-tsujo,textarea.tone-tsujo{background:#fff3f8!important}
.tone-peacock .name-input,.tone-peacock textarea,.name-input.tone-peacock,textarea.tone-peacock{background:#f6fbf1!important}
@media(max-width:760px){.tone-ottok,.tone-tsujo,.tone-peacock{border-top-color:rgba(0,0,0,.08)!important}}
.week-nav{display:flex;gap:5px;margin-bottom:7px}.week-nav button{height:29px;min-width:82px}.week-nav button.current{font-weight:800;background:#fff}.week-nav button:disabled{opacity:.4}@media(max-width:760px){.week-nav{gap:4px;margin-bottom:6px}.week-nav button{flex:1;height:36px;min-width:0;font-size:12px}}
</style>

<body>
<main class="wrap">
<section class="window">
<div class="titlebar"><div class="title-left"><div class="history-actions"><button class="history-btn" id="undoBtn" type="button" aria-label="되돌리기" title="되돌리기">↶</button><button class="history-btn" id="redoBtn" type="button" aria-label="다시 실행" title="다시 실행">↷</button></div><strong>주간 계획표</strong></div><span class="week" id="weekRange"></span></div>
<div class="body">
<div class="plan-switcher">
  <select id="planViewSelect" aria-label="계획표 선택"><option value="mine">내 계획</option></select>
  <button id="deleteSharedBtn" type="button" hidden>공유 삭제</button>
</div>
<div class="week-nav" id="weekNav">
  <button id="prevWeekBtn" type="button">〈 지난주</button>
  <button id="currentWeekBtn" type="button">이번 주</button>
  <button id="nextWeekBtn" type="button">다음주 〉</button>
</div>
<div class="char-controls"><span class="label">칸</span><button class="mini-btn" id="removeChar" type="button">−</button><span class="char-count" id="charCountText">1칸</span><button class="mini-btn" id="addChar" type="button">＋</button></div>
<div class="table" id="tableWrap"><div class="row head" id="headerRow"></div></div>
<div class="weekly"><div class="weekly-title">이번 주 메모</div><textarea id="weeklyMemo" placeholder="이번 주 목표나 기억할 내용을 적어두세요."></textarea></div>
<div class="bottom"><div class="left-info">자동 저장 · 매주 새 주간 <span class="saved" id="savedText">저장됨</span></div><div class="actions"><button id="saveBtn">저장</button><button class="share-btn" id="shareBtn">공유</button><button id="clearBtn">비우기</button></div></div>
<div class="share-note" id="shareNote"></div>
</div>
</section>
</main>
<script>

const DAYS=['목요일','금요일','토요일','일요일','월요일','화요일','수요일'];
const SHORT_DAYS=['목','금','토','일','월','화','수'];
const BASE_START=new Date(Date.UTC(2026,8,24));
const WEEK_MS=7*86400000;

const WEEK_PREFIX='weekly-planner-v4-week-';
const STRUCTURE_KEY='weekly-planner-v4-structure';
const SHARED_KEY='weekly-shared-plans-v1';
const LEGACY_NAMES_KEY='maple-simple-share-names-v3';
const LEGACY_COUNT_KEY='maple-simple-share-charcount-v2';
const LEGACY_WEEK_PREFIX='maple-simple-share-plan-v3-';

let activeView='mine';
let selectedWeekStart=getCurrentWeekStart();
let charCount=1;
let names=['이름 1','이름 2','이름 3','이름 4','이름 5','이름 6'];
let data=emptyPlanData();
let sharedPlans=loadSharedPlans();
let saveTimer=null;
const undoStack=[];
const redoStack=[];
const HISTORY_LIMIT=100;

function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return `${d.getUTCMonth()+1}.${d.getUTCDate()}`}
function weekKeyFromDate(d){return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
function dateFromWeekKey(k){
  const p=String(k||'').split('-').map(Number);
  if(p.length!==3||p.some(n=>!Number.isFinite(n))) return new Date(BASE_START);
  return new Date(Date.UTC(p[0],p[1]-1,p[2]));
}
function kstDateOnly(now=new Date()){
  const k=new Date(now.getTime()+9*60*60*1000);
  return new Date(Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate()));
}
function getCurrentWeekStart(now=new Date()){
  const today=kstDateOnly(now);
  if(today<BASE_START) return new Date(BASE_START);
  const weeks=Math.floor((today-BASE_START)/WEEK_MS);
  const d=new Date(BASE_START);
  d.setUTCDate(d.getUTCDate()+weeks*7);
  return d;
}
function shiftWeek(d,amount){
  const x=new Date(d);
  x.setUTCDate(x.getUTCDate()+amount*7);
  return x<BASE_START?new Date(BASE_START):x;
}
function emptyPlanData(){return{cells:{},daily:{},weeklyMemo:''}}
function deepCopy(v){return JSON.parse(JSON.stringify(v))}
function normalizeNames(arr){
  const out=Array.isArray(arr)?arr.slice(0,6):[];
  while(out.length<6) out.push(`이름 ${out.length+1}`);
  return out;
}
function normalizeWeekState(raw,template){
  const t=template||{charCount:1,names:['이름 1']};
  const count=Math.min(6,Math.max(1,Number(raw&&raw.charCount||t.charCount||1)));
  const nm=normalizeNames(raw&&raw.names||t.names);
  const d=raw&&raw.data?raw.data:raw||{};
  return{
    charCount:count,
    names:nm,
    data:{
      cells:d&&d.cells&&typeof d.cells==='object'?d.cells:{},
      daily:d&&d.daily&&typeof d.daily==='object'?d.daily:{},
      weeklyMemo:typeof(d&&d.weeklyMemo)==='string'?d.weeklyMemo:''
    }
  };
}
function loadStructure(){
  try{
    const s=JSON.parse(localStorage.getItem(STRUCTURE_KEY)||'null');
    if(s) return normalizeWeekState({charCount:s.charCount,names:s.names,data:emptyPlanData()});
  }catch{}
  let legacyNames=null;
  try{legacyNames=JSON.parse(localStorage.getItem(LEGACY_NAMES_KEY)||'null')}catch{}
  const legacyCount=Number(localStorage.getItem(LEGACY_COUNT_KEY)||1);
  return normalizeWeekState({charCount:legacyCount,names:legacyNames||['이름 1'],data:emptyPlanData()});
}
function saveStructure(){
  localStorage.setItem(STRUCTURE_KEY,JSON.stringify({charCount,names:[...names]}));
}
function mineStorageKey(k){return WEEK_PREFIX+k}
function loadMineWeek(k){
  try{
    const raw=JSON.parse(localStorage.getItem(mineStorageKey(k))||'null');
    if(raw) return normalizeWeekState(raw,loadStructure());
  }catch{}
  try{
    const legacy=JSON.parse(localStorage.getItem(LEGACY_WEEK_PREFIX+k)||'null');
    if(legacy){
      const s=loadStructure();
      const migrated=normalizeWeekState({charCount:s.charCount,names:s.names,data:legacy},s);
      localStorage.setItem(mineStorageKey(k),JSON.stringify(migrated));
      return migrated;
    }
  }catch{}
  return normalizeWeekState(null,loadStructure());
}
function saveMineWeek(k){
  const state={charCount,names:[...names],data:deepCopy(data)};
  localStorage.setItem(mineStorageKey(k),JSON.stringify(state));
  saveStructure();
}
function loadSharedPlans(){
  try{
    const a=JSON.parse(localStorage.getItem(SHARED_KEY)||'[]');
    return Array.isArray(a)?a:[];
  }catch{return[]}
}
function saveSharedPlans(){
  localStorage.setItem(SHARED_KEY,JSON.stringify(sharedPlans.slice(0,20)));
}
function isSharedView(){return activeView!=='mine'}
function getActiveSharedPlan(){return sharedPlans.find(p=>p.id===activeView)||null}
function getActiveWeekStart(){
  if(isSharedView()){
    const p=getActiveSharedPlan();
    return p&&p.week?dateFromWeekKey(p.week):new Date(selectedWeekStart);
  }
  return new Date(selectedWeekStart);
}
function getActiveWeekKey(){
  if(isSharedView()){
    const p=getActiveSharedPlan();
    return p&&p.week?p.week:weekKeyFromDate(selectedWeekStart);
  }
  return weekKeyFromDate(selectedWeekStart);
}
function loadActiveState(){
  if(isSharedView()){
    const p=getActiveSharedPlan();
    const s=normalizeWeekState(p||null,loadStructure());
    charCount=s.charCount;names=s.names;data=s.data;
  }else{
    const s=loadMineWeek(weekKeyFromDate(selectedWeekStart));
    charCount=s.charCount;names=s.names;data=s.data;
  }
}
function persistActive(){
  if(isSharedView()){
    const i=sharedPlans.findIndex(p=>p.id===activeView);
    if(i>=0){
      sharedPlans[i]={...sharedPlans[i],charCount,names:[...names],data:deepCopy(data)};
      saveSharedPlans();
    }
  }else{
    saveMineWeek(weekKeyFromDate(selectedWeekStart));
  }
  flashSaved();
}
function flashSaved(){
  const el=document.getElementById('savedText');
  if(!el)return;
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>el.classList.remove('show'),900);
}
function snapshotState(){
  return JSON.stringify({charCount,names:[...names],data:deepCopy(data)});
}
function pushUndo(snapshot){
  if(undoStack[undoStack.length-1]!==snapshot){
    undoStack.push(snapshot);
    if(undoStack.length>HISTORY_LIMIT)undoStack.shift();
  }
  redoStack.length=0;
  updateHistoryButtons();
}
function restoreSnapshot(snapshot){
  const s=normalizeWeekState(JSON.parse(snapshot),loadStructure());
  charCount=s.charCount;names=s.names;data=s.data;
  persistActive();
  renderPlanner();
  document.getElementById('weeklyMemo').value=data.weeklyMemo||'';
  updateHistoryButtons();
}
function undo(){
  if(!undoStack.length)return;
  const cur=snapshotState();
  const prev=undoStack.pop();
  redoStack.push(cur);
  restoreSnapshot(prev);
}
function redo(){
  if(!redoStack.length)return;
  const cur=snapshotState();
  const next=redoStack.pop();
  undoStack.push(cur);
  restoreSnapshot(next);
}
function updateHistoryButtons(){
  document.getElementById('undoBtn').disabled=!undoStack.length;
  document.getElementById('redoBtn').disabled=!redoStack.length;
}
function resetHistory(){undoStack.length=0;redoStack.length=0;updateHistoryButtons()}

function nameToneClass(name){
  const n=String(name||'').trim();
  if(n==='오똑')return'tone-ottok';
  if(n==='츠죠')return'tone-tsujo';
  if(n==='피콕')return'tone-peacock';
  return'';
}
function applyNameTone(el,name){
  el.classList.remove('tone-ottok','tone-tsujo','tone-peacock');
  const cls=nameToneClass(name);
  if(cls)el.classList.add(cls);
}
function updateColumnTone(index){
  document.querySelectorAll('[data-char-col="'+index+'"]').forEach(el=>applyNameTone(el,names[index]));
}
function updateMobileLabels(){
  document.querySelectorAll('[data-char-label]').forEach(el=>{
    const i=Number(el.dataset.charLabel);
    el.textContent=names[i]||`이름 ${i+1}`;
  });
}

function updateWeekRange(){
  const s=getActiveWeekStart(),e=new Date(s);
  e.setUTCDate(e.getUTCDate()+6);
  document.getElementById('weekRange').textContent=`${s.getUTCFullYear()}.${fmt(s)} ~ ${e.getUTCFullYear()}.${fmt(e)}`;
}
function updateWeekNav(){
  const shared=isSharedView();
  const current=getCurrentWeekStart();
  const selectedKey=weekKeyFromDate(selectedWeekStart);
  const currentKey=weekKeyFromDate(current);
  const prev=document.getElementById('prevWeekBtn');
  const now=document.getElementById('currentWeekBtn');
  const next=document.getElementById('nextWeekBtn');
  prev.disabled=shared||selectedWeekStart<=BASE_START;
  now.disabled=shared;
  next.disabled=shared;
  now.classList.toggle('current',!shared&&selectedKey===currentKey);
}
function navigateWeek(amount){
  if(isSharedView())return;
  persistActive();
  selectedWeekStart=shiftWeek(selectedWeekStart,amount);
  loadActiveState();
  resetHistory();
  renderAll();
}
function goCurrentWeek(){
  if(isSharedView())return;
  persistActive();
  selectedWeekStart=getCurrentWeekStart();
  loadActiveState();
  resetHistory();
  renderAll();
}

function sharedPlanLabel(p,index){
  const custom=(p.names||[]).find(n=>n&&String(n).trim()&&!/^이름\s*\d+$/u.test(String(n).trim()));
  const d=(p.week||'').slice(5).replace('-','/');
  return (custom?String(custom).trim():`공유 계획 ${index+1}`)+(d?` · ${d}`:'');
}
function renderPlanSwitcher(){
  const s=document.getElementById('planViewSelect');
  s.innerHTML='<option value="mine">내 계획</option>';
  sharedPlans.forEach((p,i)=>{
    const o=document.createElement('option');
    o.value=p.id;o.textContent=sharedPlanLabel(p,i);
    s.append(o);
  });
  s.value=activeView;
  document.getElementById('deleteSharedBtn').hidden=!isSharedView();
}
function activateView(id){
  persistActive();
  activeView=id;
  if(activeView==='mine') selectedWeekStart=getCurrentWeekStart();
  loadActiveState();
  resetHistory();
  renderAll();
}

const tableWrap=document.getElementById('tableWrap');
const headerRow=document.getElementById('headerRow');

function setGridColumns(){
  document.documentElement.style.setProperty('--char-count',charCount);
  document.getElementById('charCountText').textContent=`${charCount}칸`;
  document.getElementById('removeChar').disabled=charCount<=1;
  document.getElementById('addChar').disabled=charCount>=6;
}
function renderPlanner(){
  setGridColumns();
  const weekStart=getActiveWeekStart();
  headerRow.innerHTML='';

  const dayHead=document.createElement('div');
  dayHead.className='cell';
  dayHead.textContent='';
  headerRow.append(dayHead);

  for(let i=0;i<charCount;i++){
    const head=document.createElement('div');
    head.className='cell char-head';
    head.dataset.charCol=i;
    applyNameTone(head,names[i]);

    const input=document.createElement('input');
    input.className='name-input';
    input.placeholder=`이름 ${i+1}`;
    input.value=names[i]||`이름 ${i+1}`;
    input.addEventListener('input',()=>{
      const before=snapshotState();
      names[i]=input.value;
      pushUndo(before);
      updateMobileLabels();
      updateColumnTone(i);
      persistActive();
    });
    head.append(input);
    headerRow.append(head);
  }

  const memoHead=document.createElement('div');
  memoHead.className='cell';
  memoHead.textContent='메모';
  headerRow.append(memoHead);

  tableWrap.querySelectorAll('.day-row').forEach(el=>el.remove());

  DAYS.forEach((day,di)=>{
    const currentDate=new Date(weekStart);
    currentDate.setUTCDate(currentDate.getUTCDate()+di);

    const row=document.createElement('div');
    row.className='row day-row';

    const dayCell=document.createElement('div');
    dayCell.className='cell day-cell';
    if(day==='토요일')dayCell.classList.add('sat');
    if(day==='일요일')dayCell.classList.add('sun');
    dayCell.innerHTML=`<span class="day-name">${SHORT_DAYS[di]}</span><span class="date">${currentDate.getUTCMonth()+1}/${currentDate.getUTCDate()}</span>`;
    row.append(dayCell);

    for(let ci=0;ci<charCount;ci++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.charCol=ci;
      applyNameTone(cell,names[ci]);

      const label=document.createElement('div');
      label.className='mobile-label';
      label.dataset.charLabel=ci;
      label.textContent=names[ci]||`이름 ${ci+1}`;

      const ta=document.createElement('textarea');
      const key=`${di}-${ci}`;
      ta.placeholder='할 일';
      ta.value=data.cells[key]||'';
      ta.addEventListener('input',()=>{
        const before=snapshotState();
        data.cells[key]=ta.value;
        pushUndo(before);
        persistActive();
      });

      cell.append(label,ta);
      row.append(cell);
    }

    const memoCell=document.createElement('div');
    memoCell.className='cell';
    const memoLabel=document.createElement('div');
    memoLabel.className='mobile-label';
    memoLabel.textContent='메모';
    const memo=document.createElement('textarea');
    memo.placeholder='메모';
    memo.value=data.daily[di]||'';
    memo.addEventListener('input',()=>{
      const before=snapshotState();
      data.daily[di]=memo.value;
      pushUndo(before);
      persistActive();
    });
    memoCell.append(memoLabel,memo);
    row.append(memoCell);
    tableWrap.append(row);
  });
  updateMobileLabels();
}

function renderAll(){
  renderPlanSwitcher();
  updateWeekRange();
  updateWeekNav();
  renderPlanner();
  document.getElementById('weeklyMemo').value=data.weeklyMemo||'';
  updateHistoryButtons();
}

function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str);
  let binary='';
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function base64ToUtf8(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4)str+='=';
  const binary=atob(str),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function makeSharePayload(){
  return{v:5,week:getActiveWeekKey(),charCount,names:[...names],data:deepCopy(data)};
}
function buildShareUrl(){
  const payload=utf8ToBase64(JSON.stringify(makeSharePayload()));
  const u=new URL(location.href);
  u.hash='';
  u.search='';
  let p=u.pathname;
  if(/\/s\/(?:index\.html)?$/.test(p)) p=p.replace(/\/s\/(?:index\.html)?$/,'/');
  else p=p.replace(/\/index\.html$/,'/');
  if(!p.endsWith('/'))p+='/';
  u.pathname=p+'s/';
  u.searchParams.set('plan',payload);
  u.searchParams.set('sv','5');
  return u.toString();
}
function showShareMessage(text){
  const note=document.getElementById('shareNote');
  note.textContent=text;
  note.classList.add('show');
  setTimeout(()=>note.classList.remove('show'),4500);
}
async function shareCurrentPlan(){
  persistActive();
  const url=buildShareUrl();
  const shareData={title:'주간 계획표',text:`주간 계획표\n${url}`,url};
  try{
    if(navigator.share){await navigator.share(shareData);return}
    await navigator.clipboard.writeText(url);
    showShareMessage('현재 계획이 포함된 링크를 복사했어요.');
  }catch(err){
    if(err&&err.name==='AbortError')return;
    try{
      await navigator.clipboard.writeText(url);
      showShareMessage('현재 계획이 포함된 링크를 복사했어요.');
    }catch{prompt('이 링크를 복사해서 공유하세요.',url)}
  }
}
function makeSharedId(encoded){
  let h=2166136261;
  for(let i=0;i<encoded.length;i++){h^=encoded.charCodeAt(i);h=Math.imul(h,16777619)}
  return'shared-'+(h>>>0).toString(36);
}
function importSharedPlan(){
  try{
    const u=new URL(location.href);
    let encoded=u.searchParams.get('plan');
    if(!encoded&&location.hash.startsWith('#plan=')) encoded=location.hash.slice(6);
    if(!encoded)return false;

    const shared=JSON.parse(base64ToUtf8(encoded));
    if(!shared||![1,2,3,4,5].includes(shared.v)||!Array.isArray(shared.names)||!shared.data)return false;

    const id=makeSharedId(encoded);
    const item={
      id,
      receivedAt:Date.now(),
      week:shared.week||weekKeyFromDate(getCurrentWeekStart()),
      charCount:Math.min(6,Math.max(1,Number(shared.charCount||1))),
      names:normalizeNames(shared.names),
      data:normalizeWeekState(
        {charCount:shared.charCount,names:shared.names,data:shared.data},
        loadStructure()
      ).data
    };

    const i=sharedPlans.findIndex(p=>p.id===id);
    if(i>=0)sharedPlans[i]=item;
    else sharedPlans.unshift(item);
    sharedPlans=sharedPlans.slice(0,20);
    saveSharedPlans();
    activeView=id;

    u.searchParams.delete('plan');
    u.searchParams.delete('sv');
    u.hash='';
    history.replaceState(null,'',u.pathname+(u.search?u.search:''));

    setTimeout(
      ()=>showShareMessage('공유받은 계획을 따로 저장했어요. 내 계획은 그대로 유지됩니다.'),
      0
    );
    return true;
  }catch(e){
    console.warn('공유 불러오기 실패',e);
    return false;
  }
}

  if(charCount<=1)return;
  const before=snapshotState();
  charCount--;
  pushUndo(before);
  persistActive();
  renderPlanner();
});
document.getElementById('addChar').addEventListener('click',()=>{
  if(charCount>=6)return;
  const before=snapshotState();
  charCount++;
  pushUndo(before);
  persistActive();
  renderPlanner();
});
document.getElementById('weeklyMemo').addEventListener('input',e=>{
  const before=snapshotState();
  data.weeklyMemo=e.target.value;
  pushUndo(before);
  persistActive();
});
document.getElementById('saveBtn').addEventListener('click',()=>{
  persistActive();
  const b=document.getElementById('saveBtn'),t=b.textContent;
  b.textContent='저장됨';
  setTimeout(()=>b.textContent=t,900);
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!confirm('이 주의 계획과 메모를 모두 비울까요?'))return;
  const before=snapshotState();
  data=emptyPlanData();
  pushUndo(before);
  persistActive();
  renderPlanner();
  document.getElementById('weeklyMemo').value='';
});
document.getElementById('shareBtn').addEventListener('click',shareCurrentPlan);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('redoBtn').addEventListener('click',redo);
document.getElementById('planViewSelect').addEventListener('change',e=>activateView(e.target.value));
document.getElementById('deleteSharedBtn').addEventListener('click',()=>{
  if(!isSharedView())return;
  const p=getActiveSharedPlan();
  if(!p)return;
  if(!confirm('이 공유 계획을 목록에서 삭제할까요?'))return;
  sharedPlans=sharedPlans.filter(x=>x.id!==p.id);
  saveSharedPlans();
  activeView='mine';
  selectedWeekStart=getCurrentWeekStart();
  loadActiveState();
  resetHistory();
  renderAll();
});
document.getElementById('prevWeekBtn').addEventListener('click',()=>navigateWeek(-1));
document.getElementById('currentWeekBtn').addEventListener('click',goCurrentWeek);
document.getElementById('nextWeekBtn').addEventListener('click',()=>navigateWeek(1));

const imported=importSharedPlan();
if(!imported)activeView='mine';
loadActiveState();
renderAll();

setInterval(()=>{
  if(isSharedView())return;
  const currentKey=weekKeyFromDate(getCurrentWeekStart());
  const selectedKey=weekKeyFromDate(selectedWeekStart);
  if(selectedKey===currentKey)return;
  // 사용자가 과거나 미래 주를 보고 있으면 강제로 이동시키지 않음.
},60000);
