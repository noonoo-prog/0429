<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메이플 주간 계획표</title>
<meta name="theme-color" content="#5a5a5a">
<style>
*{box-sizing:border-box}body{margin:0;background:#dcdcdc;color:#333;font-family:"Malgun Gothic",Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:12px}input,textarea,button{font:inherit}.wrap{width:min(980px,calc(100% - 16px));margin:6px auto 14px}.window{border:1px solid #555;border-radius:4px;overflow:hidden;background:#cfcfcf;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 2px 8px rgba(0,0,0,.14)}.titlebar{min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;color:#fff;background:linear-gradient(#666,#4c4c4c);border-bottom:1px solid #3a3a3a;text-shadow:0 1px 1px rgba(0,0,0,.5)}.titlebar strong{font-size:14px;letter-spacing:-.02em}.week{font-size:11px;color:#ececec;white-space:nowrap}.body{padding:8px;background:#cfcfcf}.table{border:1px solid #a4a4a4;background:#bcbcbc}.row{display:grid;grid-template-columns:56px repeat(var(--char-count,3),minmax(105px,1fr)) 170px;gap:1px;background:#a4a4a4}.row+.row{margin-top:1px}.cell{background:#ececec;padding:5px;min-height:70px}.head .cell{min-height:38px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#444;background:#d9d9d9}.char-head{padding:4px;align-items:stretch!important;justify-content:stretch!important}.name-input{width:100%;height:28px;border:1px solid #9f9f9f;border-radius:2px;background:#efefef;color:#333;padding:4px 7px;font-size:12px;font-weight:700;outline:none}.name-input:focus,textarea:focus{border-color:#7f97ad;box-shadow:0 0 0 1px rgba(86,126,165,.18)}.day-cell{text-align:center;padding:8px 2px 4px;background:#dcdcdc;font-weight:700;color:#444;line-height:1.2}.day-cell .day-name{display:block;font-size:15px;margin-bottom:5px}.day-cell .date{display:block;font-size:11px;color:#666}.day-cell.sat .day-name{color:#2f75b6}.day-cell.sun .day-name{color:#d45782}textarea{width:100%;min-height:59px;resize:vertical;border:1px solid #b5b5b5;border-radius:2px;background:#f8f8f8;color:#333;padding:7px;outline:none;line-height:1.42;font-size:12px}textarea::placeholder,.name-input::placeholder{color:#a7a7a7}.weekly{margin-top:8px;border:1px solid #a4a4a4;background:#e6e6e6;padding:8px}.weekly-title{margin:0 0 6px;font-size:12px;font-weight:700;color:#444}.weekly textarea{min-height:70px}.bottom{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.left-info{font-size:11px;color:#6e6e6e}.saved{opacity:0;transition:opacity .18s ease;margin-left:6px;color:#557755;font-weight:700}.saved.show{opacity:1}.actions{display:flex;gap:6px;align-items:center}.char-controls{display:flex;align-items:center;gap:5px;margin-bottom:7px}.char-controls .label{font-size:11px;color:#5f5f5f;font-weight:700;margin-right:2px}.char-count{min-width:34px;text-align:center;font-size:11px;color:#444;font-weight:700}.mini-btn{height:25px;min-width:28px;padding:0 7px;font-size:12px}button{height:31px;border:1px solid #666;border-radius:3px;padding:0 11px;background:linear-gradient(#fff,#d7d7d7);color:#333;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 #fff inset}button:hover{background:linear-gradient(#fff,#e2e2e2)}button:disabled{opacity:.42;cursor:default}.share-btn{color:#fff;border-color:#4c4c4c;background:linear-gradient(#6c6c6c,#505050);text-shadow:0 1px 0 rgba(0,0,0,.35)}.share-btn:hover{background:linear-gradient(#777,#5a5a5a)}.share-note{display:none;margin-top:8px;border:1px solid #a8b5c0;background:#edf3f8;color:#526675;padding:7px 9px;font-size:11px;line-height:1.45;border-radius:3px}.share-note.show{display:block}
@media(max-width:760px){body{font-size:14px;background:#d0d0d0}.wrap{width:100%;margin:0}.window{border-radius:0;border-left:0;border-right:0;box-shadow:none;min-height:100vh}.titlebar{position:sticky;top:0;z-index:5;min-height:42px;padding:9px 10px}.titlebar strong{font-size:15px}.week{font-size:10px}.body{padding:7px}.char-controls{position:sticky;top:42px;z-index:4;padding:6px;margin:-1px 0 7px;background:#cfcfcf;border-bottom:1px solid #aaa}.mini-btn{min-height:32px;min-width:36px;font-size:15px}.table{border:0;background:transparent}.head{display:block;background:transparent}.head .cell:first-child,.head .cell:last-child{display:none}.head .char-head{display:block;min-height:auto;padding:0;margin-bottom:6px;background:transparent}.head .char-head:last-of-type{margin-bottom:8px}.name-input{height:37px;font-size:14px;border-radius:4px}.row.day-row{display:block;margin-bottom:8px;border:1px solid #9a9a9a;border-radius:4px;overflow:hidden;background:#bcbcbc}.row.day-row+.row.day-row{margin-top:0}.cell{min-height:auto;border-top:1px solid #d5d5d5;padding:6px}.row.day-row .cell:first-child{border-top:0}.day-cell{min-height:42px;display:flex;justify-content:space-between;align-items:center;padding:10px}.day-cell .day-name,.day-cell .date{margin:0;display:block}.day-cell .day-name{font-size:15px}.day-cell .date{font-size:11px}.mobile-label{display:block;margin:0 0 4px;font-size:10px;font-weight:700;color:#6d6d6d}textarea{min-height:65px;font-size:16px;border-radius:4px;padding:8px}.weekly{padding:8px;border-radius:4px}.weekly textarea{min-height:90px}.bottom{flex-direction:column;align-items:stretch;gap:8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}.actions{width:100%}.actions button{flex:1;height:38px;font-size:12px}}
@media(min-width:761px){.mobile-label{display:none}}
</style>
</head>
<body>
<main class="wrap">
<section class="window">
<div class="titlebar"><strong>메이플 주간 계획표</strong><span class="week" id="weekRange"></span></div>
<div class="body">
<div class="char-controls"><span class="label">캐릭터 칸</span><button class="mini-btn" id="removeChar" type="button">−</button><span class="char-count" id="charCountText">1칸</span><button class="mini-btn" id="addChar" type="button">＋</button></div>
<div class="table" id="tableWrap"><div class="row head" id="headerRow"></div></div>
<div class="weekly"><div class="weekly-title">이번 주 메모</div><textarea id="weeklyMemo" placeholder="이번 주 목표나 기억할 내용을 적어두세요."></textarea></div>
<div class="bottom"><div class="left-info">자동 저장 · 목요일마다 새 주간 <span class="saved" id="savedText">저장됨</span></div><div class="actions"><button class="share-btn" id="shareBtn">현재 계획 공유</button><button id="clearBtn">이번 주 비우기</button></div></div>
<div class="share-note" id="shareNote"></div>
</div>
</section>
</main>
<script>
const DAYS=['목요일','금요일','토요일','일요일','월요일','화요일','수요일'];
const BASE_START=new Date(Date.UTC(2026,8,24));
function pad(n){return String(n).padStart(2,'0')}
function kstDateOnly(now=new Date()){const k=new Date(now.getTime()+9*60*60*1000);return new Date(Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate()))}
function getWeekStart(now=new Date()){const today=kstDateOnly(now);if(today<BASE_START)return new Date(BASE_START);const daysFromBase=Math.floor((today-BASE_START)/86400000);const weeksFromBase=Math.floor(daysFromBase/7);const start=new Date(BASE_START);start.setUTCDate(start.getUTCDate()+weeksFromBase*7);return start}
function fmt(d){return `${d.getUTCMonth()+1}.${d.getUTCDate()}`}
function keyDate(d){return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
const start=getWeekStart(),end=new Date(start);end.setUTCDate(end.getUTCDate()+6);const weekKey=keyDate(start);
document.getElementById('weekRange').textContent=`${start.getUTCFullYear()}.${fmt(start)} ~ ${end.getUTCFullYear()}.${fmt(end)}`;
const namesKey='maple-simple-share-names-v3',countKey='maple-simple-share-charcount-v2',planKey=`maple-simple-share-plan-v3-${weekKey}`;
let charCount=Math.min(6,Math.max(1,Number(localStorage.getItem(countKey)||1)));
let names=JSON.parse(localStorage.getItem(namesKey)||'null')||['캐릭터 1','캐릭터 2','캐릭터 3'];while(names.length<6)names.push(`캐릭터 ${names.length+1}`);
let data=JSON.parse(localStorage.getItem(planKey)||'null')||{cells:{},daily:{},weeklyMemo:''},saveTimer=null;
function flashSaved(){const el=document.getElementById('savedText');el.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>el.classList.remove('show'),900)}
function save(){localStorage.setItem(namesKey,JSON.stringify(names));localStorage.setItem(countKey,String(charCount));localStorage.setItem(planKey,JSON.stringify(data));flashSaved()}
function updateMobileLabels(){document.querySelectorAll('[data-char-label]').forEach(el=>{const idx=Number(el.dataset.charLabel);el.textContent=names[idx]||`캐릭터 ${idx+1}`})}
function utf8ToBase64(str){const bytes=new TextEncoder().encode(str);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function base64ToUtf8(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const binary=atob(str),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function makeSharePayload(){return{v:2,week:weekKey,charCount,names,data}}
function buildShareUrl(){const payload=utf8ToBase64(JSON.stringify(makeSharePayload())),base=location.href.split('#')[0];return `${base}#plan=${payload}`}
function showShareMessage(text){const note=document.getElementById('shareNote');note.textContent=text;note.classList.add('show');setTimeout(()=>note.classList.remove('show'),5000)}
async function shareCurrentPlan(){save();const shareUrl=buildShareUrl(),shareData={title:'메이플 주간 계획표',text:`메이플 주간 계획표 ${weekKey}`,url:shareUrl};try{if(navigator.share){await navigator.share(shareData);return}await navigator.clipboard.writeText(shareUrl);showShareMessage('현재 계획이 포함된 링크를 복사했어요.')}catch(err){if(err&&err.name==='AbortError')return;try{await navigator.clipboard.writeText(shareUrl);showShareMessage('현재 계획이 포함된 링크를 복사했어요.')}catch{prompt('이 링크를 복사해서 공유하세요.',shareUrl)}}}
function importSharedPlan(){if(!location.hash.startsWith('#plan='))return;try{const encoded=location.hash.slice(6),shared=JSON.parse(base64ToUtf8(encoded));if(!shared||![1,2].includes(shared.v)||!Array.isArray(shared.names)||!shared.data)return;const importedKey=`maple-imported-${encoded.slice(0,24)}`;if(sessionStorage.getItem(importedKey))return;const ok=confirm('공유받은 계획표를 불러올까요?\n현재 같은 주의 내용은 덮어쓸 수 있습니다.');if(!ok){sessionStorage.setItem(importedKey,'skip');return}charCount=Math.min(6,Math.max(1,Number(shared.charCount||3)));names=shared.names.slice(0,6);while(names.length<6)names.push(`캐릭터 ${names.length+1}`);data=shared.data;localStorage.setItem(countKey,String(charCount));localStorage.setItem(namesKey,JSON.stringify(names));localStorage.setItem(planKey,JSON.stringify(data));sessionStorage.setItem(importedKey,'yes');history.replaceState(null,'',location.href.split('#')[0]);location.reload()}catch(e){console.warn('공유 불러오기 실패',e)}}
const tableWrap=document.getElementById('tableWrap'),headerRow=document.getElementById('headerRow');
function setGridColumns(){document.documentElement.style.setProperty('--char-count',charCount);document.getElementById('charCountText').textContent=`${charCount}칸`;document.getElementById('removeChar').disabled=charCount<=1;document.getElementById('addChar').disabled=charCount>=6}
function renderPlanner(){setGridColumns();headerRow.innerHTML='';const dayHead=document.createElement('div');dayHead.className='cell';dayHead.textContent='요일';headerRow.append(dayHead);for(let i=0;i<charCount;i++){const head=document.createElement('div');head.className='cell char-head';const input=document.createElement('input');input.className='name-input';input.placeholder=`캐릭터 ${i+1}`;input.value=names[i]||`캐릭터 ${i+1}`;input.addEventListener('input',()=>{names[i]=input.value;updateMobileLabels();save()});head.append(input);headerRow.append(head)}const memoHead=document.createElement('div');memoHead.className='cell';memoHead.textContent='메모';headerRow.append(memoHead);tableWrap.querySelectorAll('.day-row').forEach(el=>el.remove());DAYS.forEach((day,di)=>{const currentDate=new Date(start);currentDate.setUTCDate(currentDate.getUTCDate()+di);const row=document.createElement('div');row.className='row day-row';const dayCell=document.createElement('div');dayCell.className='cell day-cell';if(day==='토요일')dayCell.classList.add('sat');if(day==='일요일')dayCell.classList.add('sun');dayCell.innerHTML=`<span class="day-name">${day.replace('요일','')}</span><span class="date">${currentDate.getUTCMonth()+1}/${currentDate.getUTCDate()}</span>`;row.append(dayCell);for(let ci=0;ci<charCount;ci++){const cell=document.createElement('div');cell.className='cell';const label=document.createElement('div');label.className='mobile-label';label.dataset.charLabel=ci;label.textContent=names[ci]||`캐릭터 ${ci+1}`;const ta=document.createElement('textarea');const key=`${di}-${ci}`;ta.placeholder='할 일';ta.value=data.cells[key]||'';ta.addEventListener('input',()=>{data.cells[key]=ta.value;save()});cell.append(label,ta);row.append(cell)}const memoCell=document.createElement('div');memoCell.className='cell';const memoLabel=document.createElement('div');memoLabel.className='mobile-label';memoLabel.textContent='메모';const memo=document.createElement('textarea');memo.placeholder='메모';memo.value=data.daily[di]||'';memo.addEventListener('input',()=>{data.daily[di]=memo.value;save()});memoCell.append(memoLabel,memo);row.append(memoCell);tableWrap.append(row)});updateMobileLabels()}
document.getElementById('removeChar').addEventListener('click',()=>{if(charCount<=1)return;charCount--;save();renderPlanner()});
document.getElementById('addChar').addEventListener('click',()=>{if(charCount>=6)return;charCount++;save();renderPlanner()});
const weeklyMemo=document.getElementById('weeklyMemo');weeklyMemo.value=data.weeklyMemo||'';weeklyMemo.addEventListener('input',()=>{data.weeklyMemo=weeklyMemo.value;save()});
document.getElementById('shareBtn').addEventListener('click',shareCurrentPlan);
document.getElementById('clearBtn').addEventListener('click',()=>{if(!confirm('이번 주 계획과 메모를 모두 비울까요?'))return;data={cells:{},daily:{},weeklyMemo:''};localStorage.setItem(planKey,JSON.stringify(data));document.querySelectorAll('.day-row textarea').forEach(el=>el.value='');weeklyMemo.value='';flashSaved()});
importSharedPlan();renderPlanner();setInterval(()=>{const currentKey=keyDate(getWeekStart());if(currentKey!==weekKey)location.reload()},60000);
</script>
</body>
</html>
